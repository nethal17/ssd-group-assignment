name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No build step for an Express app, so the equivalent gate is:
      # every source file parses, and every module actually imports.
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Import check
        # Catches bad import paths and missing exports, which parsing misses.
        # index.js is excluded - it connects to Mongo at import time.
        env:
          JWT_SECRET: ci-placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
        run: |
          find config controllers middleware models routes utils -name '*.js' -print0 \
            | xargs -0 -I{} node --input-type=module -e "await import('./{}')"

      - name: Import path case check
        # The runner is case-sensitive, macOS is not - a wrong-case import works
        # locally and breaks here. Covers index.js, which the import check skips.
        run: |
          node -e '
            const fs=require("fs"), path=require("path");
            const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{
              if(e.name==="node_modules"||e.name.startsWith("."))return[];
              const p=path.join(d,e.name);
              return e.isDirectory()?walk(p):(p.endsWith(".js")?[p]:[]);});
            let bad=0;
            for(const f of walk(".")){
              for(const m of fs.readFileSync(f,"utf8")
                  .matchAll(/(?:from|import)\s+["\x27](\.[^"\x27]+)["\x27]/g)){
                const t=path.resolve(path.dirname(f),m[1]);
                const d=path.dirname(t), b=path.basename(t);
                if(fs.existsSync(d)&&!fs.readdirSync(d).includes(b)){
                  console.error(`broken import in ${f}: ${m[1]}`); bad++;
                }
              }
            }
            if(bad) process.exit(1);
            console.log("all imports resolve case-correctly");
          '

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Report-only: 4 pre-existing errors. Remove continue-on-error to enforce.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      # Runs with no account, so this job still reports something if the Snyk
      # token is missing or the free quota is used up.
      # Report-only today: backend has 12 high, frontend 18 high + 2 critical.
      # Once those are triaged, drop continue-on-error to make it a real gate.
      - name: npm audit
        id: audit
        continue-on-error: true
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high

      - name: Snyk dependency scan
        # Skipped rather than failed when SNYK_TOKEN isn't configured.
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/node@master
        with:
          args: >-
            --severity-threshold=high
            --file=${{ matrix.workspace }}/package.json

      - name: Summary
        if: always()
        working-directory: ${{ matrix.workspace }}
        run: |
          {
            echo "### ${{ matrix.workspace }} security scan"
            echo ""
            if [ -z "$SNYK_TOKEN" ]; then
              echo "- Snyk: **skipped** (no SNYK_TOKEN secret configured)"
            else
              echo "- Snyk: ran (see step log)"
            fi
            echo "- npm audit: \`${{ steps.audit.outcome }}\`"
            echo ""
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
